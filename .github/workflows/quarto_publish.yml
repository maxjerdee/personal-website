# WHY THIS NO LONGER RUNS ON EVERY PUSH. docs/ is committed, and it was also
# re-rendered here and committed again by the bot -- so every push to
# quarto_src/ paid to reproduce a render that was already in the commit, and the
# two renders then collided, which is where the repeated docs/ merge conflicts
# came from. The local render is verifiable before it is pushed; this one was
# not. So rendering is now a manual button, for when a render is needed without
# a local Quarto.
#
# `make render` before committing is what keeps docs/ correct. It is the same
# command this workflow runs.
on:
  workflow_dispatch:

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto site
        run: quarto render quarto_src

      - name: Commit and push rendered docs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "auto: render quarto site [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push
