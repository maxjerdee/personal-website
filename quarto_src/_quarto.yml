project:
  type: website
  output-dir: ../docs
  resources:
  # The vendored explorer, served at /edgewise. A `resources` entry is copied
  # through verbatim -- Quarto does not render it, so it keeps its own <head>
  # and gets none of this site's navbar or theme. That is the point: it is a
  # standalone app, not a page. Refresh it with tools/sync_edgewise.py.
  - "./edgewise"
  - "./assets"
  - "./demos_code"
  - "CNAME"

website:
  title: "Max Jerdee"
  # A page with `draft: true` renders as an empty stub and appears in no listing,
  # navigation or search -- so a half-written note can live in the repo without
  # being readable on the site. Use `QUARTO_PROFILE=drafting` locally to see and
  # edit them (see _quarto-drafting.yml). NOT `unlinked`: that publishes the full
  # text at a guessable URL and only hides the link, which is not the same as
  # unpublished.
  draft-mode: gone
  favicon: assets/images/icon.svg
  google-analytics: "G-SY1YC6MMLM"
  navbar:
    left:
      - href: research.qmd
        text: Research
      - href: papers.qmd
        text: Papers
      - href: code.qmd
        text: Code
      - href: demos.qmd
        text: Demos
      - href: notes.qmd
        text: Notes
      - href: assets/pdf/CV.pdf
        text: CV

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true



